[project]
name = "h3map-backend"
version = "0.1.0"
description = "FastAPI backend for the H3 Map workspace (PostGIS access, MVT, H3)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "h3>=4.1",
  "pyjwt>=2.8",
  "pyyaml>=6",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "hypothesis>=6.100",
  "testcontainers>=4.7", "httpx>=0.27", "mapbox-vector-tile>=2.0", "schemathesis>=3.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"
markers = [
  "h3pg: needs a PostgreSQL image with the h3 extension",
  "perf: performance measurement (needs generated large datasets)",
]

[tool.coverage.run]
omit = ["app/db/app_models.py"]
